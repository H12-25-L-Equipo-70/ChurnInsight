<div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
  <table class="w-full text-sm">
    <thead class="bg-slate-100 border-b border-slate-200 sticky top-0">
      <tr>
        <th scope="col" class="px-5 py-3 text-left font-bold text-slate-900">
          Empresa
        </th>
        <th scope="col" class="px-5 py-3 text-left font-bold text-slate-900">
          CUIT
        </th>
        <th scope="col" class="px-5 py-3 text-left font-bold text-slate-900">
          Sector
        </th>
        <th scope="col" class="px-5 py-3 text-center font-bold text-slate-900">
          Riesgo
        </th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200">
      <tr *ngFor="let company of companies" class="hover:bg-slate-50 transition">
        <td class="px-5 py-3 font-medium text-slate-900">
          {{ company.Nombre_Empresa }}
        </td>
        <td class="px-5 py-3 text-slate-700 font-mono text-xs">
          {{ company.CUIT }}
        </td>
        <td class="px-5 py-3 text-slate-700">
          {{ company.Sector }}
        </td>
        <td class="px-5 py-3 text-center">
          <span
            class="inline-flex items-center justify-center rounded-full px-3 py-1 text-xs font-bold"
            [ngClass]="{
              'bg-red-100 text-red-700': company.Churn,
              'bg-green-100 text-green-700': !company.Churn
            }"
          >
            {{ company.Churn ? '⚠️ Alto' : '✅ Bajo' }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
