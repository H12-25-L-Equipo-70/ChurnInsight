<div class="p-4 sm:p-6 space-y-6">

  <!-- Header -->
  <div class="pb-4 border-b border-slate-200">
    <h1 class="text-3xl font-bold text-slate-900">Bienvenido a ChurnInsight</h1>
    <p class="text-slate-600">Tu centro de control para el análisis de riesgo de abandono de clientes.</p>
  </div>

  <!-- KPIs -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
    <app-kpi-card 
      title="Total de Empresas" 
      [value]="totalCompanies()" 
      icon="🏢" 
      color="text-emerald-600">
    </app-kpi-card>
    <app-kpi-card 
      title="Prob. Media de Churn" 
      [value]="avgChurnProbability()" 
      unit="%" 
      icon="⚠️" 
      color="text-amber-600">
    </app-kpi-card>
    <app-kpi-card 
      title="Empresas en Riesgo Alto" 
      [value]="highRiskCompanies()" 
      icon="🔥" 
      color="text-red-600">
    </app-kpi-card>
  </div>

  <!-- Main Content Grid - Balanced Layout -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    
    <!-- Columna 1: Tabla de Empresas (Primary) -->
    <div class="lg:col-span-1 bg-white p-4 sm:p-6 rounded-lg shadow-lg border border-slate-200 order-2 lg:order-1">
      <h2 class="text-xl font-semibold text-slate-800 mb-4">📊 Detalle de Empresas</h2>
      <div class="h-96 overflow-y-auto">
        <app-company-list [companies]="companies()"></app-company-list>
      </div>
    </div>

    <!-- Columna 2: Gráfico (Secondary, smaller) -->
    <div class="lg:col-span-1 bg-white p-4 sm:p-6 rounded-lg shadow-lg border border-slate-200 order-1 lg:order-2">
      <h2 class="text-xl font-semibold text-slate-800 mb-4">🔴 Distribución de Riesgo</h2>
      <div class="h-80 flex items-center justify-center">
        <app-churn-distribution-chart [data]="companies()"></app-churn-distribution-chart>
      </div>
    </div>

  </div>
</div>
